<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>植物病虫害检疫与传播追溯</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 2rem; color: #1f2937; }
    main { max-width: 960px; margin: auto; }
    section { border: 1px solid #e5e7eb; border-radius: 8px; padding: 1rem 1.25rem; margin-bottom: 1.25rem; }
    h1 { font-size: 1.4rem; }
    h2 { font-size: 1.1rem; margin-top: 0; }
    label { display: inline-block; margin: .25rem .5rem .25rem 0; font-size: .9rem; }
    input, select { padding: .3rem .45rem; border: 1px solid #d1d5db; border-radius: 6px; }
    button { padding: .4rem .8rem; cursor: pointer; border: 1px solid #d1d5db; border-radius: 6px; background: #fff; }
    button.primary { background: #2563eb; border-color: #2563eb; color: #fff; }
    button.danger { background: #dc2626; border-color: #dc2626; color: #fff; }
    table { border-collapse: collapse; width: 100%; margin-top: .5rem; font-size: .88rem; }
    th, td { border: 1px solid #e5e7eb; padding: .35rem .5rem; text-align: left; vertical-align: top; }
    th { background: #f9fafb; }
    .tag { display: inline-block; padding: .1rem .45rem; border-radius: 999px; font-size: .78rem; }
    .tag.active { background: #fee2e2; color: #b91c1c; }
    .tag.lifted { background: #dcfce7; color: #15803d; }
    .tag.shipped { background: #dbeafe; color: #1d4ed8; }
    .ok { color: #15803d; }
    .bad { color: #b91c1c; }
    pre { background: #f3f4f6; padding: .75rem; border-radius: 8px; overflow-x: auto; font-size: .8rem; }
    .muted { color: #6b7280; font-size: .82rem; }
  </style>
</head>
<body>
<main>
  <h1>植物病虫害检疫与传播追溯</h1>

  <section>
    <h2>身份</h2>
    <label>用户 <input id="userId" value="insp-1" size="10"></label>
    <label>角色
      <select id="role">
        <option value="inspector" selected>inspector（检疫员）</option>
        <option value="admin">admin</option>
        <option value="quarantine">quarantine</option>
        <option value="viewer">viewer</option>
      </select>
    </label>
    <span class="muted">疫区登记/解除需要 inspector 或 admin 角色</span>
  </section>

  <section>
    <h2>设施</h2>
    <label>名称 <input id="facName" size="12" placeholder="苗圃中心"></label>
    <label>地址 <input id="facAddr" size="12" placeholder="A县"></label>
    <button onclick="createFacility()">登记设施</button>
    <table id="facilityTable"><thead><tr><th>ID</th><th>名称</th><th>地址</th><th>状态</th></tr></thead><tbody></tbody></table>
  </section>

  <section>
    <h2>疫区管理</h2>
    <div>
      <label>疫区编号 <input id="zoneNo" size="12" placeholder="ZQ-2026-001"></label>
      <label>中心设施 <select id="zoneCenter"></select></label>
      <label>纳入设施（可多选）<select id="zoneFacilities" multiple size="3"></select></label>
      <label>原因 <input id="zoneReason" size="24" placeholder="借过同一批苗/共用车辆"></label>
      <label>最近阳性日期 <input id="zonePositiveSince" type="date"></label>
      <button class="primary" onclick="createZone()">登记疫区</button>
    </div>
    <div id="zoneList"></div>
  </section>

  <section>
    <h2>批次调运</h2>
    <div>
      <label>批次号 <input id="conCode" size="10" placeholder="C-100"></label>
      <label>起点设施 <select id="conOrigin"></select></label>
      <label>终点设施 <select id="conDestination"></select></label>
      <button onclick="createConsignment()">登记批次</button>
    </div>
    <table id="consignmentTable"><thead><tr><th>批次号</th><th>起点</th><th>终点</th><th>状态</th><th>操作</th></tr></thead><tbody></tbody></table>
  </section>

  <section>
    <h2>结果</h2>
    <pre id="result">等待操作</pre>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
let facilities = [];

function headers() {
  return {
    'Content-Type': 'application/json',
    'X-User-Id': $('userId').value || 'anonymous',
    'X-Role': $('role').value,
  };
}

function show(payload) {
  $('result').textContent = typeof payload === 'string' ? payload : JSON.stringify(payload, null, 2);
}

async function call(method, path, body) {
  const response = await fetch(path, {
    method,
    headers: headers(),
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  const payload = await response.json();
  if (!response.ok) {
    show(payload);
    throw new Error(payload.error || response.statusText);
  }
  return payload;
}

function facilityName(id) {
  const hit = facilities.find((f) => f.id === id);
  return hit ? hit.name : (id || '-');
}

async function refreshFacilities() {
  const data = await call('GET', '/api/facilities');
  facilities = data.items;
  const tbody = $('facilityTable').querySelector('tbody');
  tbody.innerHTML = facilities.map((f) =>
    `<tr><td>${f.id}</td><td>${f.data.name}</td><td>${f.data.address}</td><td>${f.status}</td></tr>`
  ).join('');
  for (const id of ['zoneCenter', 'zoneFacilities', 'conOrigin', 'conDestination']) {
    const select = $(id);
    const selected = Array.from(select.selectedOptions || []).map((o) => o.value);
    select.innerHTML = facilities.map((f) =>
      `<option value="${f.id}" ${selected.includes(f.id) ? 'selected' : ''}>${f.data.name}</option>`
    ).join('');
  }
}

async function refreshZones() {
  const data = await call('GET', '/api/zones');
  $('zoneList').innerHTML = data.items.map((z) => {
    const d = z.data;
    const r = d.release || {};
    const rows = (d.facility_ids || []).map((fid) =>
      `<tr><td>${facilityName(fid)}</td><td>${(d.facility_reasons || {})[fid] || '-'}</td></tr>`
    ).join('');
    const conditions = z.status === 'active' ? `
      <p>解除条件：
        <span class="${r.wait_days_ok ? 'ok' : 'bad'}">① 最近一次阳性满 ${r.required_days} 天（已过 ${r.days_since_last_positive} 天）</span>；
        <span class="${r.no_new_positive_ok ? 'ok' : 'bad'}">② 观察期内无新增阳性设施${r.no_new_positive_ok ? '' : '（' + (r.new_positive_within_window || []).map(facilityName).join('、') + '）'}</span>；
        最早可解除日期：${r.earliest_release_date || '-'}
      </p>` : '';
    const blocked = (d.blocked_consignment_ids || []).length
      ? `<p class="bad">被拦批次：${d.blocked_consignment_ids.length} 个</p>` : '';
    const actions = z.status === 'active' ? `
      <p>
        <button onclick="markPositive('${z.id}')">登记新增阳性</button>
        <button class="danger" onclick="liftZone('${z.id}')">解除疫区</button>
      </p>` : '';
    return `<section>
      <p><b>${d.zone_no}</b> <span class="tag ${z.status}">${z.status === 'active' ? '生效中' : '已解除'}</span>
        <span class="muted">中心设施：${facilityName(d.center_facility_id)}　登记原因：${d.reason}</span></p>
      <table><thead><tr><th>纳入设施</th><th>纳入原因</th></tr></thead><tbody>${rows}</tbody></table>
      ${conditions}${blocked}${actions}
    </section>`;
  }).join('') || '<p class="muted">暂无疫区</p>';
}

async function refreshConsignments() {
  const data = await call('GET', '/api/consignments');
  const tbody = $('consignmentTable').querySelector('tbody');
  tbody.innerHTML = data.items.map((c) => {
    const canShip = ['declared', 'released'].includes(c.status);
    return `<tr>
      <td>${c.data.code}</td>
      <td>${facilityName(c.data.origin_facility_id)}</td>
      <td>${facilityName(c.data.destination_facility_id)}</td>
      <td><span class="tag ${c.status}">${c.status}</span></td>
      <td>${canShip ? `<button onclick="ship('${c.id}')">发起调运</button>` : ''}</td>
    </tr>`;
  }).join('');
}

async function refreshAll() {
  await refreshFacilities();
  await Promise.all([refreshZones(), refreshConsignments()]);
}

async function createFacility() {
  try {
    await call('POST', '/api/facilities', { name: $('facName').value, address: $('facAddr').value });
    show('设施已登记');
    await refreshAll();
  } catch (e) {}
}

async function createZone() {
  try {
    const extra = Array.from($('zoneFacilities').selectedOptions).map((o) => o.value);
    const body = {
      zone_no: $('zoneNo').value,
      center_facility_id: $('zoneCenter').value,
      facility_ids: extra,
      reason: $('zoneReason').value,
    };
    if ($('zonePositiveSince').value) body.positive_since = $('zonePositiveSince').value;
    await call('POST', '/api/zones', body);
    show('疫区已登记并生效');
    await refreshAll();
  } catch (e) {}
}

async function markPositive(zoneId) {
  const options = facilities.map((f) => `${f.id} ${f.data.name}`).join('\n');
  const input = prompt('新增阳性设施（输入设施ID）：\n' + options);
  if (!input) return;
  const facilityId = input.trim().split(/\s+/)[0];
  const found = prompt('阳性检出日期（YYYY-MM-DD，留空为今天）：') || '';
  try {
    await call('POST', `/api/entities/${zoneId}/actions`, {
      action: 'mark_positive',
      data: { facility_id: facilityId, date: found || undefined },
    });
    show('已登记新增阳性，二十一天观察期重新计算');
    await refreshAll();
  } catch (e) {}
}

async function liftZone(zoneId) {
  try {
    await call('POST', `/api/entities/${zoneId}/actions`, { action: 'lift', data: {} });
    show('疫区已解除，被拦批次可重新发起调运');
    await refreshAll();
  } catch (e) {}
}

async function createConsignment() {
  try {
    await call('POST', '/api/consignments', {
      code: $('conCode').value,
      origin: facilityName($('conOrigin').value),
      destination: facilityName($('conDestination').value),
      origin_facility_id: $('conOrigin').value,
      destination_facility_id: $('conDestination').value,
    });
    show('批次已登记');
    await refreshConsignments();
  } catch (e) {}
}

async function ship(consignmentId) {
  try {
    await call('POST', `/api/entities/${consignmentId}/actions`, { action: 'ship', data: {} });
    show('调运已发起');
    await refreshAll();
  } catch (e) {}
}

refreshAll().catch(show);
</script>
</body>
</html>
